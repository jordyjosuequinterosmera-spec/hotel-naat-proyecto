<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel NAAT - Administración</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .admin-login-wrapper {
        max-width: 500px;
        margin: 60px auto 100px auto;
        padding: 40px 20px;
        text-align: center;
      }

      .credentials-title {
        font-size: 1.1rem;
        color: #444;
        margin-bottom: 25px;
        font-weight: 500;
      }

      .admin-login-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
      }

      .admin-input-group {
        width: 100%;
        max-width: 320px;
      }

      .admin-input-group input {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid #c0c0c0;
        border-radius: 6px;
        font-size: 0.95rem;
        outline: none;
        box-sizing: border-box;
        background-color: #fff;
      }

      .admin-input-group input:focus {
        border-color: #28a745;
      }

      .admin-actions {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
        width: 100%;
        max-width: 380px;
      }

      .btn-acceder {
        background-color: #f8f9fa;
        color: #28a745;
        border: 1px solid #b0b0b0;
        padding: 8px 24px;
        font-size: 0.95rem;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-acceder:hover {
        background-color: #28a745;
        color: #fff;
        border-color: #28a745;
      }

      .btn-volver-menu {
        background-color: #f8f9fa;
        color: #dc3545;
        border: 1px solid #b0b0b0;
        padding: 8px 20px;
        font-size: 0.95rem;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: all 0.2s ease;
      }

      .btn-volver-menu:hover {
        background-color: #dc3545;
        color: #fff;
        border-color: #dc3545;
      }

      .alert-error {
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- HEADER / LOGO Y NAVEGACIÓN -->
    <header class="main-header">
      <div class="header-container">
        <div class="logo-wrapper">
          <img
            src="assets/images/logo.png"
            alt="Logo Hotel NAAT"
            class="logo-img"
            onerror="this.style.display = 'none'"
          />
        </div>
        <nav class="main-nav">
          <ul>
            <li><a href="index.html">inicio</a></li>
            <li><a href="habitaciones.html">habitaciones</a></li>
            <li><a href="eventos.html">eventos</a></li>
            <li><a href="contactanos.html">contactanos</a></li>
            <li>
              <a
                href="admin.html"
                class="active"
                style="color: #0088cc; font-weight: bold"
                >administrativo</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- TÍTULO PRINCIPAL DE LA PÁGINA -->
    <section class="hero-section">
      <h1 class="hero-title" style="color: #28a745">Hotel NAAT</h1>
    </section>

    <!-- FORMULARIO DE CREDENCIALES -->
    <main class="admin-login-wrapper">
      <div class="credentials-title">credenciales</div>

      <form id="admin-login-form" class="admin-login-form">
        <div class="admin-input-group">
          <input
            type="text"
            id="admin-user"
            placeholder="usuario"
            required
            autocomplete="username"
          />
        </div>

        <div class="admin-input-group">
          <input
            type="password"
            id="admin-pass"
            placeholder="contraseña"
            required
            autocomplete="current-password"
          />
        </div>

        <div id="login-error" class="alert-error">
          Usuario o contraseña incorrectos
        </div>

        <div class="admin-actions">
          <button type="submit" class="btn-acceder">acceder</button>
          <a href="index.html" class="btn-volver-menu">volver menu principal</a>
        </div>
      </form>
    </main>

    <!-- FOOTER -->
    <footer class="main-footer">
      <div class="footer-container">
        <div class="footer-info">
          <h4>direccion</h4>
          <p>calle ....... frente a ...... guayas - ecuador</p>
        </div>
        <div class="footer-info">
          <h4>correo</h4>
          <p>Hotel.NAATec.@gmail.com</p>
        </div>
      </div>
    </footer>

    <!-- En admin.html -->
    <script>
      document
        .getElementById("admin-login-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const usuario = document.getElementById("admin-user").value.trim();
          const password = document.getElementById("admin-pass").value.trim();
          const errorDiv = document.getElementById("login-error");

          errorDiv.style.display = "none";

          try {
            const res = await fetch("/api/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ usuario, password }),
            });

            const data = await res.json();

            if (data.success) {
              localStorage.setItem(
                "adminSession",
                JSON.stringify({
                  loggedIn: true,
                  admin: data.admin,
                  tokenTime: new Date(),
                }),
              );
              window.location.href = "dashboard-admin.html";
            } else {
              errorDiv.textContent = data.message || "Credenciales no válidas";
              errorDiv.style.display = "block";
            }
          } catch (err) {
            console.error("Error en autenticación:", err);
            errorDiv.textContent = "Error de conexión con el servidor.";
            errorDiv.style.display = "block";
          }
        });
    </script>
  </body>
</html>
